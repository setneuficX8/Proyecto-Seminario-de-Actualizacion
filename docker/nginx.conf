# Configuración de producción de Nginx para servir la SPA (React + Vite).
# El Dockerfile la copia a /etc/nginx/conf.d/default.conf dentro de la imagen.
#
# Nota sobre add_header: Nginx NO hereda los add_header del bloque padre cuando
# un bloque `location` define los suyos, por eso las cabeceras de seguridad se
# repiten en cada location que fija cabeceras de caché.

server {
    listen      80;
    listen      [::]:80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Compresión de texto/JS/CSS/JSON/SVG.
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_min_length 1024;
    gzip_types      text/plain text/css text/xml application/javascript
                    application/json application/xml image/svg+xml;

    # Assets generados por Vite: el nombre incluye un hash de contenido, así que
    # son inmutables y se pueden cachear indefinidamente.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        try_files $uri =404;
    }

    # Estáticos servidos desde public/ (file.svg, rot.png, ...).
    location ~* \.(svg|png|jpe?g|gif|ico|webp|avif|woff2?|ttf|eot)$ {
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Fallback SPA: el enrutado lo resuelve React Router (BrowserRouter), por lo
    # que cualquier ruta desconocida debe devolver index.html (no 404).
    # index.html se sirve sin caché para que los despliegues se vean al instante.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri $uri/ /index.html;
    }
}
